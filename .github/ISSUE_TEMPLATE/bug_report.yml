name: Bug report
description: Report a problem with a pattern or repository structure
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the fields below.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
  - type: textarea
    id: logs
    attributes:
      label: Examples or logs
      description: Add sanitized examples or excerpts if helpful. Do not include confidential data, credentials, or personal information.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context that may help resolve the issue.
